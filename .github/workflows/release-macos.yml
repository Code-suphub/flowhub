name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Build macOS installers
        run: |
          set -euo pipefail

          if [[ -n "${MAC_CSC_LINK:-}" ]]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Apple signing credentials are not configured; publishing unsigned installers."
          fi

          if [[ -n "${NOTARIZE_APPLE_ID:-}" && -n "${NOTARIZE_APP_PASSWORD:-}" && -n "${NOTARIZE_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="$NOTARIZE_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$NOTARIZE_APP_PASSWORD"
            export APPLE_TEAM_ID="$NOTARIZE_APPLE_TEAM_ID"
          fi

          npm run release:mac -- --x64 --arm64
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify release assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"

          for ARCH in x64 arm64; do
            test -f "dist/FlowHub-${VERSION}-mac-${ARCH}.dmg"
            test -f "dist/FlowHub-${VERSION}-mac-${ARCH}.dmg.blockmap"
            test -f "dist/FlowHub-${VERSION}-mac-${ARCH}.zip"
            test -f "dist/FlowHub-${VERSION}-mac-${ARCH}.zip.blockmap"
            grep -q "FlowHub-${VERSION}-mac-${ARCH}.zip" dist/latest-mac.yml
          done

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"

          gh release create "$GITHUB_REF_NAME" \
            "dist/FlowHub-${VERSION}-mac-x64.dmg" \
            "dist/FlowHub-${VERSION}-mac-x64.dmg.blockmap" \
            "dist/FlowHub-${VERSION}-mac-x64.zip" \
            "dist/FlowHub-${VERSION}-mac-x64.zip.blockmap" \
            "dist/FlowHub-${VERSION}-mac-arm64.dmg" \
            "dist/FlowHub-${VERSION}-mac-arm64.dmg.blockmap" \
            "dist/FlowHub-${VERSION}-mac-arm64.zip" \
            "dist/FlowHub-${VERSION}-mac-arm64.zip.blockmap" \
            dist/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" \
            --title "FlowHub ${VERSION}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
