name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          # Intel builds are paused; restore x86_64-apple-darwin here when needed.
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Verify updater signing secret
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Import macOS code-signing certificate
        env:
          FLOWHUB_MACOS_CERTIFICATE: ${{ secrets.FLOWHUB_MACOS_CERTIFICATE }}
          FLOWHUB_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.FLOWHUB_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$FLOWHUB_MACOS_CERTIFICATE"
          test -n "$FLOWHUB_MACOS_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/flowhub-codesign.p12"
          keychain_path="$RUNNER_TEMP/flowhub-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$FLOWHUB_MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$FLOWHUB_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-certificate -c "FlowHub Local Development" "$keychain_path" >/dev/null

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: FlowHub __VERSION__
          releaseBody: 请下载与 Mac 芯片架构对应的 DMG 安装。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  finalize-updater:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Replace API asset URLs with public download URLs
        run: |
          mkdir -p updater-metadata
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater-metadata
          node app/scripts/fix-updater-metadata.mjs updater-metadata/latest.json "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" updater-metadata/latest.json --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
