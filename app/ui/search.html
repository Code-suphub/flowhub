<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowHub</title>
    <link rel="stylesheet" href="browser-preview.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #12a9d4;
        --bg: #1b2530;
        --panel: #242f3c;
        --text: #e6edf3;
        --muted: #8fa3b3;
        --border: #33404e;
        --sel: rgba(18, 169, 212, 0.18);
      }
      html, body { height: 100%; }
      body {
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        overflow: hidden;
        border: 1px solid #3a4a58;
        border-radius: 14px;
      }
      .shell { height: 100%; display: flex; flex-direction: column; background: var(--bg); border-radius: 14px; }
      .drag-bar { height: 28px; -webkit-app-region: drag; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
      .window-actions { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
      .window-action { width: 24px; height: 22px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; cursor: pointer; }
      .window-action:hover { color: var(--text); background: #2b3a48; }
      .input-wrap { padding: 10px 14px 14px; }
      #q {
        width: 100%;
        padding: 10px 14px;
        font-size: 18px;
        color: var(--text);
        background: #111922;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
      }
      #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(18,169,212,0.15); }
      .scope-row { display: flex; align-items: center; gap: 5px; padding: 0 14px 10px; color: var(--muted); font-size: 11px; }
      .scope-button { padding: 4px 9px; border: 1px solid transparent; border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; }
      .scope-button:hover { color: var(--text); background: #2b3a48; }
      .scope-button.active { color: var(--text); border-color: rgba(18, 169, 212, .4); background: var(--sel); }
      .clipboard-kind-row { display: none; align-items: center; gap: 5px; padding: 0 14px 10px; color: var(--muted); font-size: 11px; }
      .clipboard-kind-row.visible { display: flex; }
      .clipboard-kind-button { padding: 4px 9px; border: 1px solid transparent; border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; }
      .clipboard-kind-button:hover { color: var(--text); background: #2b3a48; }
      .clipboard-kind-button.active { color: var(--text); border-color: rgba(18, 169, 212, .4); background: var(--sel); }
      #results { flex: 1; overflow-y: auto; padding: 4px 8px 10px; }
      .plugin-load-status { padding: 10px 0 6px; color: var(--muted); font-size: 11px; text-align: center; }
      .empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
      .usage-section { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 10px 4px; padding-top: 4px; color: #d5e4ed; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .usage-section small { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0; }
      .usage-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 9px; scrollbar-width: thin; scrollbar-color: #405261 transparent; }
      .usage-tile { width: 68px; min-width: 68px; height: 72px; flex: 0 0 68px; flex-direction: column; justify-content: flex-start; gap: 5px; padding: 6px 4px 5px; border-radius: 9px; text-align: center; }
      .usage-tile:hover { background: #2b3a48; }
      .usage-tile-icon { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 34px; border-radius: 8px; overflow: hidden; font-size: 17px; }
      .usage-tile.app .usage-tile-icon { color: #b9c9ff; background: rgba(113, 137, 255, .14); }
      .usage-tile.web .usage-tile-icon { color: var(--accent); background: rgba(18, 169, 212, .12); }
      .usage-tile-icon img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; }
      .usage-tile.app .usage-tile-icon img { background: transparent; }
      .usage-tile.web .usage-tile-icon img { padding: 4px; background: #f5f7f8; }
      .usage-tile-name { width: 100%; color: #d8e2e9; font-size: 10px; line-height: 1.25; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
      .result { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
      .result.active { background: var(--sel); }
      .r-icon { width: 26px; height: 26px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 6px; overflow: hidden; }
      .r-icon img { width: 22px; height: 22px; object-fit: contain; background: #fff; border-radius: 4px; }
      .r-icon.clipboard { color: var(--accent); background: rgba(18, 169, 212, .12); font-size: 15px; }
      .r-icon.clipboard img { width: 26px; height: 26px; }
      .r-icon.clipboard img.native-clipboard-icon { width: 26px; height: 26px; background: transparent; border-radius: 0; }
      .r-icon.app { color: #b9c9ff; background: rgba(113, 137, 255, .14); font-size: 15px; }
      .r-icon.app img { width: 26px; height: 26px; background: transparent; border-radius: 5px; }
      .app-result .r-icon, .app-result .r-kind { margin-top: 2px; }
      .clipboard-file-symbol { width: 23px; height: 23px; display: block; }
      .clipboard-file-symbol.folder { color: #63b9e8; }
      .clipboard-file-symbol.image { color: #73d0ae; }
      .clipboard-file-symbol.file { color: #b9c9d3; }
      .r-body { min-width: 0; flex: 1; }
      .r-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .r-meta { margin-top: 2px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .clipboard-result { align-items: flex-start; }
      .clipboard-result .r-icon, .clipboard-result .r-kind { margin-top: 2px; }
      .r-title.clipboard-title {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        line-height: 1.35;
        text-overflow: clip;
      }
      .r-title.clipboard-title.expandable { -webkit-line-clamp: 5; }
      .r-title.clipboard-title.is-expanded {
        display: block;
        max-height: 240px;
        overflow: auto;
        -webkit-line-clamp: unset;
      }
      .clipboard-meta-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .r-meta.clipboard-meta {
        display: block;
        min-width: 0;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .clipboard-toggle {
        flex: 0 0 auto;
        border: 0;
        padding: 1px 4px;
        color: var(--muted);
        background: transparent;
        border-radius: 5px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .clipboard-toggle:hover, .clipboard-toggle:focus-visible {
        color: var(--text);
        background: rgba(18, 169, 212, .12);
        outline: none;
      }
      .r-meta .path { color: var(--accent); }
      .r-kind { flex: 0 0 auto; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
      .memo-result { position: relative; align-items: flex-start; min-height: 82px; padding: 9px 10px; }
      .memo-terminal { width: 27px; height: 27px; display: grid; place-items: center; flex: 0 0 27px; margin-top: 12px; border: 1px solid rgba(226, 151, 77, .2); border-radius: 7px; color: #efb971; background: rgba(226, 151, 77, .08); font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; font-weight: 800; }
      .memo-path { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; color: #8498a4; font-size: 9px; line-height: 1; }
      .memo-path span:last-child { color: #e5af6b; font-weight: 750; }
      .memo-path i { color: #50616d; font-style: normal; }
      .memo-heading { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .memo-heading .r-title { min-width: 0; }
      .memo-command { display: -webkit-box; margin-top: 4px; overflow: hidden; color: #c7d8d4; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; line-height: 1.38; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .memo-description { display: block; color: #708594; }
      .r-kind.memo { color: #dba66e; border-color: rgba(219, 166, 110, .28); }
      .foot { border-top: 1px solid var(--border); padding: 8px 14px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
      .foot code { background: #111922; padding: 1px 6px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="drag-bar">
        <div class="window-actions">
          <button class="window-action" id="settingsBtn" title="打开配置管理">⚙</button>
          <button class="window-action" id="pinBtn" title="固定/取消固定">📌</button>
        </div>
      </div>
      <div class="input-wrap">
        <input id="q" autocomplete="off" placeholder="搜索网页、应用、剪切板或命令备忘…" />
      </div>
      <div class="scope-row" id="scopeRow" aria-label="搜索范围">
        <span>范围</span>
      </div>
      <div class="clipboard-kind-row" id="clipboardKindRow" aria-label="剪切板类型筛选">
        <span>类型</span>
        <button class="clipboard-kind-button active" data-clipboard-kind="all" aria-pressed="true">全部</button>
        <button class="clipboard-kind-button" data-clipboard-kind="text" aria-pressed="false">文本</button>
        <button class="clipboard-kind-button" data-clipboard-kind="image" aria-pressed="false">图片</button>
        <button class="clipboard-kind-button" data-clipboard-kind="file" aria-pressed="false">文件</button>
      </div>
      <div id="results"></div>
      <div class="foot">
        <span id="keyboardHint">←→ 常用/最近 · ↑↓ 区块与结果 · <code>Tab</code> 范围 · <code>⏎</code> 打开</span>
        <span id="runtimeMode">FlowHub</span>
      </div>
    </div>
    <script src="web-search.js"></script>
    <script src="memo-catalog.js"></script>
    <script src="tauri-adapter.js"></script>
    <script src="browser-adapter.js"></script>
    <script src="search.js"></script>
  </body>
</html>
