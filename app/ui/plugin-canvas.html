<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowHub · 桌面组件</title><link rel="stylesheet" href="plugin-canvas.css"></head><body>
<header><button id="dragSurface" class="brand" title="移动组件区域">⠿ <span>桌面组件</span></button><div class="tools"><label class="pin"><input id="pin" type="checkbox">置顶</label><button id="add" class="primary">＋ 添加组件</button></div><button id="closeSurface" aria-label="关闭组件区域">×</button></header>
<section class="heading"><div><span class="eyebrow">WORKSPACE</span><h1><select id="boards" aria-label="切换布局"></select></h1></div><div class="board-tools"><button id="newBoard" title="新建布局">＋ 布局</button><button id="rename">重命名</button><button id="removeBoard">删除</button></div></section>
<p id="notice" role="status"></p><main id="canvas" aria-label="插件画布"></main><footer><span class="live-dot"></span><span id="live">每 15 秒更新插件缓存</span><span>拖动卡片调整位置 · 边角缩放 · 右键编辑</span></footer>
<dialog id="picker"><form id="widgetForm"><div class="dialog-head"><h2>添加组件</h2><button type="button" data-close="picker" aria-label="关闭">×</button></div><label>插件<select id="source" required></select></label><label>卡片名称<input id="cardTitle" maxlength="60" placeholder="默认使用插件名称"></label><iframe id="widgetEditor" title="插件组件配置" sandbox="allow-scripts"></iframe><p id="pickerError" role="status"></p><button class="primary" type="submit">添加到画布</button></form></dialog>
<dialog id="nameDialog"><form id="nameForm"><h2 id="nameTitle">新建布局</h2><input id="boardName" required maxlength="40" aria-label="布局名称"><div class="tools"><button type="button" data-close="nameDialog">取消</button><button class="primary">保存</button></div></form></dialog>
<dialog id="deleteDialog"><h2>删除此布局？</h2><p>其中的卡片布局会被移除，插件配置不受影响。</p><div class="tools"><button data-close="deleteDialog">取消</button><button id="confirmDelete">删除布局</button></div></dialog>
<script src="widget-layout.js"></script><script src="widget-frame.js"></script><script src="plugin-canvas.js"></script><script src="select-control.js"></script></body></html>
