<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="plugin-market.css"><title>插件市场</title></head><body>
<header><h1>插件市场</h1><button id="choose">安装开发目录</button></header>
<nav role="tablist" aria-label="插件市场"><button role="tab" data-tab="discover" aria-selected="true">发现</button><button role="tab" data-tab="installed" aria-selected="false" tabindex="-1">已安装</button><button role="tab" data-tab="sources" aria-selected="false" tabindex="-1">来源</button></nav>
<p id="notice" role="status" aria-live="polite"></p>
<section id="discover" role="tabpanel"><div class="toolbar"><input id="search" type="search" aria-label="搜索插件" placeholder="搜索插件名称或描述"><button id="scan">刷新来源</button><button id="goSources">配置来源</button></div><div id="discoverRows"></div></section>
<section id="installed" role="tabpanel" hidden><main id="plugins"></main></section>
<section id="sources" role="tabpanel" hidden><div class="toolbar"><h2>插件来源</h2><button id="addSource">添加来源</button></div><form id="sourceForm" hidden><input id="sourceId" type="hidden"><label>名称<input id="sourceName" required maxlength="100" placeholder="例如：本地开发插件"></label><fieldset><legend>来源类型</legend><label class="radio"><input type="radio" name="kind" value="local" checked>本地目录</label><label class="radio"><input type="radio" name="kind" value="https">HTTPS 仓库</label></fieldset><label>目录或仓库索引地址<span class="path-field"><input id="sourceLocation" required placeholder="插件目录或 catalog.json 地址"><button id="pickSource" type="button">选择目录</button></span></label><label id="keyField" hidden>仓库签名公钥<input id="sourceKey" placeholder="minisign 公钥"></label><div class="actions"><button type="submit">保存来源</button><button id="cancelSource" type="button">取消</button></div></form><div id="sourceRows"></div></section>
<dialog id="installDialog" aria-labelledby="installTitle"><h2 id="installTitle">安装插件</h2><p id="installInfo"></p><div class="actions"><button id="cancelInstall">取消</button><button id="confirmInstall">确认安装</button></div></dialog><script src="plugin-market.js"></script></body></html>
