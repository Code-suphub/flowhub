<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowHub Organizer</title>
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      button {
        width: 100%;
        height: 100%;
        padding: 0 1px 1px 0;
        border: 0;
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.95), 0 1px 1px rgba(0, 0, 0, 0.65);
        background: transparent;
        font: 600 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        cursor: default;
        -webkit-app-region: no-drag;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
      button:active { background: rgba(255, 255, 255, 0.2); }
    </style>
  </head>
  <body>
    <button id="toggle" type="button" aria-label="收起菜单栏隐藏区">›</button>
    <script>
      const button = document.querySelector("#toggle");
      window.setOrganizerCollapsed = (collapsed) => {
        button.textContent = collapsed ? "‹" : "›";
        button.setAttribute("aria-label", collapsed ? "展开菜单栏隐藏区" : "收起菜单栏隐藏区");
      };
      button.addEventListener("click", async () => {
        button.disabled = true;
        try {
          const result = await window.__TAURI__.core.invoke("toggle_menu_bar_items");
          window.setOrganizerCollapsed(Boolean(result.collapsed));
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
