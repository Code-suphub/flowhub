[package]
name = "flowhub-tauri"
version = "0.1.3"
description = "FlowHub desktop launcher"
authors = ["FlowHub contributors"]
edition = "2021"

[lib]
name = "flowhub_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-rs = "0.3.5"
dirs = "6"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["time"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
