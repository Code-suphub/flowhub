[package]
name = "flowhub-tauri"
version = "0.1.8"
description = "FlowHub desktop launcher"
authors = ["FlowHub contributors"]
edition = "2021"

[lib]
name = "flowhub_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-rs = "0.3.5"
dirs = "6"
enigo = "0.6.1"
image = { version = "0.25", default-features = false, features = ["png"] }
# The updater disables reqwest defaults; restore macOS/Windows system proxy discovery.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2.5"
semver = "1"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["time", "sync"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSImage", "NSImageView", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSScreen", "NSScrollView", "NSClipView", "NSVisualEffectView", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSSwitch", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["block2", "NSBundle", "NSURL", "NSNotification", "NSOperation", "NSArray", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSObject", "NSString", "NSUserDefaults"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
tray-icon = "0.24.2"
